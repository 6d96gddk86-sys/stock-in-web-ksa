<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Star Stock Search</title>
<style>
  :root {
    --bg:#f5f7fa;
    --card:#ffffff;
    --text:#172033;
    --muted:#687386;
    --line:#dfe5ec;
    --accent:#17365d;
    --accent2:#1f4e78;
    --chip:#eef4f8;
    --ok:#0f766e;
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .top {
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(255,255,255,.96);
    backdrop-filter: blur(10px);
    border-bottom:1px solid var(--line);
    padding:14px 14px 12px;
  }
  .wrap {
    max-width:1100px;
    margin:0 auto;
  }
  h1 {
    margin:0 0 10px;
    font-size:22px;
    color:var(--accent);
  }
  .search {
    width:100%;
    font-size:18px;
    padding:14px 16px;
    border:2px solid #b8c4d1;
    border-radius:14px;
    outline:none;
    background:white;
  }
  .search:focus {
    border-color:var(--accent2);
    box-shadow:0 0 0 3px rgba(31,78,120,.10);
  }
  .toolbar {
    display:flex;
    gap:8px;
    align-items:center;
    margin-top:10px;
    flex-wrap:wrap;
  }
  select, button {
    font-size:15px;
    padding:9px 10px;
    border:1px solid #c8d1dc;
    border-radius:10px;
    background:white;
    color:var(--text);
  }
  .count {
    margin-left:auto;
    color:var(--muted);
    font-size:14px;
  }
  main {
    max-width:1100px;
    margin:0 auto;
    padding:14px;
  }
  .hint {
    color:var(--muted);
    margin:4px 2px 14px;
    font-size:14px;
  }
  .card {
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    margin-bottom:10px;
    box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .row1 {
    display:flex;
    gap:10px;
    align-items:flex-start;
    justify-content:space-between;
  }
  .model {
    font-size:18px;
    font-weight:800;
    line-height:1.25;
  }
  .make {
    color:var(--accent2);
    font-weight:700;
    font-size:13px;
    margin-bottom:3px;
    text-transform:uppercase;
    letter-spacing:.4px;
  }
  .part {
    font-weight:800;
    font-size:16px;
    color:#111827;
    white-space:nowrap;
  }
  .chips {
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:9px;
  }
  .chip {
    background:var(--chip);
    border-radius:999px;
    padding:5px 9px;
    font-size:13px;
    color:#334155;
  }
  .desc {
    margin-top:10px;
    color:#3d4756;
    font-size:14px;
    line-height:1.35;
  }
  .stock {
    margin-top:10px;
    padding-top:9px;
    border-top:1px solid var(--line);
    display:grid;
    grid-template-columns: repeat(5, minmax(0,1fr));
    gap:6px;
  }
  .stock div {
    text-align:center;
    background:#f8fafc;
    border-radius:9px;
    padding:7px 4px;
    font-size:12px;
    color:var(--muted);
  }
  .stock b {
    display:block;
    font-size:15px;
    color:var(--text);
    margin-top:2px;
  }
  .total b {
    color:var(--ok);
  }
  .empty {
    text-align:center;
    color:var(--muted);
    padding:40px 15px;
  }
  .highlight {
    background:#fff1a8;
    border-radius:3px;
    padding:0 1px;
  }
  @media (max-width:640px) {
    .top { padding:12px; }
    h1 { font-size:20px; }
    main { padding:10px; }
    .search { font-size:17px; }
    .model { font-size:17px; }
    .part { font-size:15px; }
    .stock {
      grid-template-columns: repeat(2, minmax(0,1fr));
    }
    .stock .total { grid-column: span 2; }
    .count { width:100%; margin-left:0; }
  }
</style>
</head>
<body>
<div class="top">
  <div class="wrap">
    <h1>Golden Star Stock Search</h1>
    <input id="q" class="search" type="search"
      placeholder="Search model, part #, year, make..."
      autocomplete="off" autofocus>
    <div class="toolbar">
      <select id="makeFilter">
        <option value="">All Makes</option>
      </select>
      <button id="clearBtn" type="button">Clear</button>
      <div class="count" id="count"></div>
    </div>
  </div>
</div>

<main>
  <div class="hint">Try: <b>Camry</b>, <b>12765</b>, <b>2013</b>, <b>AT</b>, <b>Hyundai</b></div>
  <div id="results"></div>
</main>

const q = document.getElementById('q');
const results = document.getElementById('results');
const count = document.getElementById('count');
const makeFilter = document.getElementById('makeFilter');
const clearBtn = document.getElementById('clearBtn');

const makes = [...new Set(DATA.map(x => x.make || '').filter(Boolean))]
  .sort((a,b)=>a.localeCompare(b));
makes.forEach(m => {
  const o = document.createElement('option');
  o.value = m;
  o.textContent = m;
  makeFilter.appendChild(o);
});

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[c]));
}

function searchText(r) {
  return [
    r.make, r.model, r.code, r.year, r.transmission, r.item,
    r['Al Qassim'], r.Dammam, r.Jeddah, r.Riyadh, r.total
  ].join(' ').toLowerCase();
}

function highlight(text, term) {
  const safe = esc(text);
  if (!term) return safe;
  const parts = term.trim().split(/\s+/).filter(Boolean);
  let out = safe;
  for (const p of parts) {
    const re = new RegExp('(' + p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','ig');
    out = out.replace(re, '<span class="highlight">$1</span>');
  }
  return out;
}

function render() {
  const term = q.value.trim().toLowerCase();
  const selectedMake = makeFilter.value;

  const terms = term.split(/\s+/).filter(Boolean);
  const filtered = DATA.filter(r => {
    if (selectedMake && r.make !== selectedMake) return false;
    const hay = searchText(r);
    return terms.every(t => hay.includes(t));
  });

  count.textContent = `${filtered.length} result${filtered.length===1?'':'s'}`;

  if (!filtered.length) {
    results.innerHTML = '<div class="empty">No matching stock found.</div>';
    return;
  }

  results.innerHTML = filtered.map(r => `
    <div class="card">
      <div class="row1">
        <div>
          <div class="make">${highlight(r.make, term)}</div>
          <div class="model">${highlight(r.model, term)}</div>
        </div>
        <div class="part">${highlight(r.code, term)}</div>
      </div>

      <div class="chips">
        ${r.year ? `<span class="chip">Year: <b>${highlight(r.year, term)}</b></span>` : ''}
        ${r.transmission ? `<span class="chip">Trans: <b>${highlight(r.transmission, term)}</b></span>` : ''}
      </div>

      <div class="desc">${highlight(r.item, term)}</div>

      <div class="stock">
        <div>Al Qassim<b>${esc(r['Al Qassim'] ?? '-')}</b></div>
        <div>Dammam<b>${esc(r.Dammam ?? '-')}</b></div>
        <div>Jeddah<b>${esc(r.Jeddah ?? '-')}</b></div>
        <div>Riyadh<b>${esc(r.Riyadh ?? '-')}</b></div>
        <div class="total">Total<b>${esc(r.total ?? '-')}</b></div>
      </div>
    </div>
  `).join('');
}

q.addEventListener('input', render);
makeFilter.addEventListener('change', render);
clearBtn.addEventListener('click', () => {
  q.value = '';
  makeFilter.value = '';
  render();
  q.focus();
});

render();
</script>
